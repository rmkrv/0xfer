name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach artifacts to
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ hashFiles('build.sh') }}-${{ runner.os }}
      - name: Ninja
        run: command -v ninja >/dev/null || sudo apt-get install -y ninja-build
      - name: Build
        run: ./build.sh
      - name: Bench — parity gates the release
        run: |
          npm ci
          node bench/bench.mjs | tee bench.out
          grep -q "parity ✓" bench.out
          ! grep -q "parity ✗" bench.out
      - name: Checksums
        run: cd dist && sha256sum decimen_codec.js decimen_codec.wasm > SHA256SUMS.txt
      - name: Attach artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/decimen_codec.js
            dist/decimen_codec.wasm
            dist/SHA256SUMS.txt
